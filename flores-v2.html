<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flores Mágicas - Edward-Night 🌸</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #0a0a2a 0%, #1a0a2a 50%, #0a0a2a 100%);
    }
    canvas {
      display: block;
    }
    #mensaje {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffb347;
      font-size: 32px;
      font-family: "Georgia", "Pacifico", cursive;
      font-weight: bold;
      text-shadow: 0 0 15px rgba(255, 179, 71, 0.8), 0 0 30px rgba(255, 107, 157, 0.5);
      pointer-events: none;
      white-space: nowrap;
      animation: titleGlow 2s ease-in-out infinite;
    }
    
    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 10px rgba(255, 179, 71, 0.6); }
      50% { text-shadow: 0 0 25px rgba(255, 179, 71, 0.9), 0 0 15px rgba(255, 107, 157, 0.7); }
    }
    
    #limpiar {
      position: absolute;
      bottom: 50px;
      left: 15px;
      color: rgba(255, 179, 71, 0.7);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Arial', sans-serif;
      transition: 0.3s;
      background: rgba(0,0,0,0.4);
      padding: 5px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    #limpiar:hover {
      color: #ffb347;
      text-shadow: 0 0 5px #ffb347;
      background: rgba(0,0,0,0.6);
    }
    
    /* Créditos */
    .credits {
      position: fixed;
      bottom: 15px;
      right: 15px;
      color: rgba(255, 179, 71, 0.7);
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 14px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      letter-spacing: 1px;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255, 179, 71, 0.3);
    }
    
    .credits span {
      color: #ff80ab;
      font-weight: bold;
    }
    
    @media (max-width: 600px) {
      #mensaje {
        font-size: 20px;
        white-space: normal;
        text-align: center;
        width: 90%;
      }
      .credits {
        font-size: 9px;
        white-space: nowrap;
        right: 10px;
        bottom: 10px;
      }
      #limpiar {
        bottom: 45px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="mensaje">🌸 Flores para mi Maryyy ❤️</div>
  <div id="limpiar">✨ Limpiar las flores ✨</div>
  
  <!-- Créditos -->
  <div class="credits">
    ✨ hecho con amor por <span>Edward-Night</span> 🌸
  </div>
  
  <audio id="sonidoFlor" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_6f41f3b252.mp3?filename=magic-1-6843.mp3"></audio>
  <audio id="musicaFondo" src="https://cdn.pixabay.com/download/audio/2021/10/18/audio_0a1a4fa2d5.mp3?filename=relaxing-meditation-ambient-10962.mp3" loop></audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    resizeCanvas();

    window.addEventListener('resize', resizeCanvas);

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particula {
      constructor(x, y) {
        this.x = x + (Math.random() * 40 - 20);
        this.y = y + (Math.random() * 40 - 20);
        this.size = Math.random() * 3 + 1;
        this.alpha = 1;
        this.velY = -0.3 - Math.random() * 0.5;
        this.velX = Math.random() * 0.6 - 0.3;
        // Colores pastel: rosa, lavanda, melocotón
        const pastelColors = [330, 280, 20, 350, 300];
        const hue = pastelColors[Math.floor(Math.random() * pastelColors.length)] + (Math.random() * 30 - 15);
        this.color = `hsla(${hue}, 80%, 70%,`;
      }

      dibujar(ctx) {
        this.x += this.velX;
        this.y += this.velY;
        this.alpha -= 0.01;
        if (this.alpha > 0) {
          ctx.beginPath();
          ctx.fillStyle = this.color + this.alpha + ")";
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    class Flor {
      constructor(x, y) {
        this.x = x;
        this.yObjetivo = y;
        this.yBase = canvas.height;
        this.altura = 0;
        this.maxAltura = this.yBase - this.yObjetivo;
        this.creciendo = true;
        this.petalos = 5 + Math.floor(Math.random() * 3);
        this.radio = 15 + Math.random() * 25;
        
        // Colores pastel para las flores
        const pastelHues = [330, 350, 20, 300, 280];
        const mainHue = pastelHues[Math.floor(Math.random() * pastelHues.length)];
        const secondHue = mainHue + (Math.random() * 30 - 15);
        
        this.color1 = `hsl(${mainHue}, 85%, 70%)`;
        this.color2 = `hsl(${secondHue}, 80%, 65%)`;
        this.t = 0;
        this.particulas = [];
      }

      dibujar(ctx) {
        ctx.save();

        if (this.creciendo) {
          this.altura += 3;
          if (this.altura >= this.maxAltura) {
            this.altura = this.maxAltura;
            this.creciendo = false;
          }
        }

        const ondas = Math.sin(this.t * 0.03 + this.x * 0.01) * 30;

        ctx.strokeStyle = "#6b8e23";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.yBase);
        ctx.quadraticCurveTo(
          this.x + ondas,
          this.yBase - this.altura / 2,
          this.x,
          this.yBase - this.altura
        );
        ctx.stroke();

        ctx.translate(this.x, this.yBase - this.altura);
        ctx.rotate(Math.sin(this.t * 0.02) * 0.15);

        for (let i = 0; i < this.petalos; i++) {
          ctx.rotate((Math.PI * 2) / this.petalos);
          let grad = ctx.createRadialGradient(0, 0, this.radio * 0.2, 0, 0, this.radio);
          grad.addColorStop(0, "#fff8f0");
          grad.addColorStop(0.2, this.color1);
          grad.addColorStop(1, this.color2);
          ctx.fillStyle = grad;

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(this.radio, -this.radio, 0, -this.radio * 1.5);
          ctx.quadraticCurveTo(-this.radio, -this.radio, 0, 0);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(0, 0, this.radio * 1.2, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,215,0,0.4)";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Centro de la flor
        ctx.beginPath();
        ctx.arc(0, 0, this.radio * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${Math.random() * 30 + 40}, 70%, 60%)`;
        ctx.fill();

        ctx.restore();

        if (Math.random() < 0.25) {
          this.particulas.push(new Particula(this.x, this.yBase - this.altura));
        }

        this.particulas.forEach(p => p.dibujar(ctx));
        this.particulas = this.particulas.filter(p => p.alpha > 0);

        this.t++;
      }
    }

    const flores = [];
    const sonidoFlor = document.getElementById("sonidoFlor");
    const musicaFondo = document.getElementById("musicaFondo");
    
    // Configurar volumen
    musicaFondo.volume = 0.3;
    sonidoFlor.volume = 0.4;

    canvas.addEventListener('click', (e) => {
      flores.push(new Flor(e.clientX, e.clientY));
      sonidoFlor.currentTime = 0;
      sonidoFlor.play().catch(e => console.log("Audio no disponible"));
      if (musicaFondo.paused) {
        musicaFondo.play().catch(e => console.log("Audio no disponible"));
      }
    });

    document.getElementById('limpiar').addEventListener('click', () => {
      flores.length = 0;
    });

    // Estrellas de fondo animadas
    let estrellas = [];
    for (let i = 0; i < 100; i++) {
      estrellas.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        alpha: Math.random()
      });
    }

    function dibujarEstrellas() {
      for (let estrella of estrellas) {
        ctx.beginPath();
        ctx.arc(estrella.x, estrella.y, estrella.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${estrella.alpha * 0.5})`;
        ctx.fill();
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dibujarEstrellas();
      for (let flor of flores) {
        flor.dibujar(ctx);
      }
      requestAnimationFrame(loop);
    }

    // Actualizar estrellas al redimensionar
    window.addEventListener('resize', () => {
      resizeCanvas();
      estrellas = [];
      for (let i = 0; i < 120; i++) {
        estrellas.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          alpha: Math.random()
        });
      }
    });

    loop();
  </script>
</body>
</html>
